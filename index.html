<div class="obar" id="obar">

</div>

<section class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-top">
    <h2 data-ui="yourOrder">Your order</h2>
    <button class="x" id="sheetclose" aria-label="Close">&times;</button>
  </div>
  <div class="sheet-body" id="sheetbody"></div>
  <div class="undo" id="undo">
    <span class="undo-l" data-ui="cleared">Order cleared</span>
    <button class="undo-go" id="undogo" data-ui="undo">Undo</button>
    <button class="undo-x" id="undox" aria-label="Dismiss">&times;</button>
  </div>
  <div class="sheet-foot" id="sheetfoot">
    <div class="totrow"><span class="totlbl" data-ui="total">Total</span><span class="totval" id="ototal2">₩0</span></div>
    <div class="acts">
      <button class="btn ghost" id="clearorder" data-ui="clear">Clear</button>
      <button class="btn solid" id="showwaiter" data-ui="showWaiter">Show to waiter</button>
    </div>
  </div>
</section>

<section class="chooser" id="chooser" aria-hidden="true">
  <div class="ch-card">
    <div class="ch-top">
      <h2 id="chtitle"></h2>
      <button class="x" id="chclose" aria-label="Close">&times;</button>
    </div>
    <div class="ch-body" id="chbody"></div>
    <div class="ch-foot"><button class="btn solid" id="chgo" data-ui="confirmSet">Confirm</button></div>
  </div>
</section>

<section class="waiter" id="waiter" aria-hidden="true">
  <div class="wtop"><h2 data-uiw="order">Order</h2><button class="x" id="waiterclose" aria-label="Close">&times;</button></div>
  <div class="wbody" id="waiterbody"></div>
</section>

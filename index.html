<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0"><!-- match --paper -->
<title>HIDEOUT — look test v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   TYPE SCALE — one knob. Ratios locked to your mockup:
   nav 6x · section head 8x · item name+price 5x · ingredients 3x
   =========================================================== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  /* ---------------------------------------------------------
     Everything below is a proportion of screen width, taken
     from the 1179px draft. Change --railw and the whole grid
     rescales; nothing here is a magic pixel.

       card width  523.5179 / 1179 = .4440   (both tabs)
       ckt photo   650.0545 / 1179 = .5514   → 4:5
       ckt panel   342.0555 / 1179 = .2901   → .653 × card
       ckt open    865.5734 / 1179 = .7342
       food panel  523.5179 / 1179 = .4440   → 1.00 × card
       food open  1047.0358 / 1179 = .8881
       type unit        7.5 / 1179 = .00636
     --------------------------------------------------------- */
  --railw:393px;                     /* set by JS to the live width */

  --f-card:.4440;
  --f-open-drink:.7342;
  --f-open-food:.8881;
  --f-gut:.0509;
  --f-gap:.0305;
  --f-lead:.10;                      /* invisible card at the head of each rail */
  --f-trail:.16;                     /* and at the tail — gives the ends room to centre */

  --w-card:calc(var(--railw) * var(--f-card));
  --w-open-drink:calc(var(--railw) * var(--f-open-drink));
  --w-open-food:calc(var(--railw) * var(--f-open-food));
  --gut:calc(var(--railw) * var(--f-gut));
  --gap:calc(var(--railw) * var(--f-gap));
  --lead:calc(var(--railw) * var(--f-lead));
  --trail:calc(var(--railw) * var(--f-trail));

  /* type: 1x scales with the screen, clamped so it stays readable
     on a 320px phone and doesn't bloat on a 430px one */
  --x:clamp(2.15px, calc(var(--railw) * .00636), 2.95px);
  /* Hangul has no ascenders or descenders and fills more of its box, so at
     an identical pixel size it reads smaller than Jost beside it. --tscale
     lifts type only — not padding, not card widths — so the layout holds
     while the Korean stops looking undersized. Latin inside a Korean menu
     ("IPA", "No. 1") grows with it, which keeps a mixed line even. */
  --tscale:1;          /* tabs, section headings, item names and prices */
  --sscale:1;          /* descriptions, notes, subtitles — the small stuff */
  --tr:var(--en-track);  /* letter-spacing nudge, set per language below */
  --lead:var(--en-lead); /* line spacing for body copy, likewise */
  --fscale:var(--en-foot); /* the footnote only, independent of --sscale */
  --t-nav:calc(var(--x)*6*var(--tscale));
  --t-head:calc(var(--x)*8*var(--tscale));
  --t-item:calc(var(--x)*5*var(--tscale));
  --t-ing:calc(var(--x)*3*var(--sscale));

  --paper:#fff;     /* page background */
  --ink:#131313;       /* body text, headings, order bar */
  --dim:#8b877f;       /* secondary text: notes, variant labels, descriptions */
  --rule:#b3b0a8;      /* hairlines: card borders, row dividers */
  --magenta:#e6155a;   /* prices, cart badge, non-alcoholic tag */
  --heat-mid:#f2679a;  /* second flame from the right */
  --heat-soft:#f9b4cd; /* third — each step left is lighter */
  --magenta-dim:#f2679a; /* an add-on's price: a real charge, quieter */

  /* ---------------------------------------------------------
     TWEAK BLOCK — the numbers you will actually want to nudge
     while looking at the thing on a phone. Everything is in
     units of --x, so it scales with the screen: bump the
     multiplier, not the unit.
     --------------------------------------------------------- */
  --mode-icon-h:9.5;      /* HEIGHT of the light/dark icon. Sized by height,
                           not width, because the sun and the speech-bubble
                           have different proportions — matching their widths
                           leaves them looking unequal. */
  --mode-icon-y:-1.5;      /* optical nudge, same idea as the language one */

  --lang-icon:10;       /* width of the language icon in the masthead */
  --lang-icon-y:-1.4;    /* optical centring: negative lifts it, positive
                           drops it. The glyph's visual weight sits low, so
                           geometric centre reads as too far down. */

  --heat-inset-x:4;   /* flame's gap from the LEFT edge of the photo */
  --heat-inset-y:3;     /* and from the BOTTOM edge */
  --heat-size:4;        /* width of one flame */
  --heat-overlap:.8;   /* how far each flame sits over the one to its left */

  --addon-indent:6;     /* how far an add-on line is inset from its dish.
                           Size no longer signals that it is subordinate, so
                           position has to. 0 lines them up flush. */

  --clear-share:1;      /* how the two buttons under an order split the row */
  --waiter-share:3;     /* 1 and 3 = Clear takes a quarter of the width */

  --set-gap:20;         /* space between one set card and the next — the end
                           of a blurb to the top of the following photo */
  --set-step-gap:5;     /* space above and below the +/- on a set card, i.e.
                           how far it sits from the price and the blurb */

  --note-gap:1;       /* gap between an item name and its note, where the
                           note is on its own line (Shots, Non-alcoholic) */
  --note-lead:1.4;      /* line spacing WITHIN a note that wraps */
  --en-foot:1;          /* footnote size, Latin. Its own knob because the
                           footnote is the one piece of small text that is
                           always on screen — it wants to be quieter than a
                           description, not the same size. */
  --en-lead:1.6;       /* line spacing inside a description or ingredient
                           list. Korean has its own below — Hangul sets a
                           taller line at the same value, so the two need
                           different numbers to look the same. */
  --en-track:0em;       /* letter-spacing nudge for Latin. Negative tightens
                           every tracked element at once while keeping their
                           relative differences — tabs stay looser than body
                           text. 0em is the original spacing. */

  /* --- Korean only. Latin is never touched by these three. --- */
  --ko-type:1.12;          /* tabs, headings, item names — you judged these fine,
                           so this starts at 1. Raise if that changes. */
  --ko-small:1.5;      /* descriptions, ingredient lines, notes, subtitles,
                           the order-sheet second line. This is the one that
                           reads too small in Hangul. */
  --ko-foot:1.15;      /* footnote size, Korean. Deliberately well below
                           --ko-small: at 1.5 the footnote was setting two
                           big lines and sitting there permanently. */
  --ko-lead:1.55;      /* line spacing for Korean descriptions and ingredient
                           lists. Lower tightens the gap between wrapped
                           lines; --en-lead is the Latin equivalent. */
  --ko-track:-.1em;    /* Hangul needs less letter-spacing than uppercase
                           Jost — the tracking that opens up Latin scatters
                           Korean. Negative tightens; 0em leaves it alone. */
  --step-squeeze:3;     /* how much of the +/- buttons' height is allowed to
                           overhang its row instead of pushing the note down.
                           Raise it if --note-gap still bottoms out; lower it
                           toward 0 to put the old spacing back. */

  /* The panel at the foot of an order. In light mode it is simply the page;
     in dark it inverts to paper, which is where the one bright thing on
     screen lives. Named separately because it does NOT follow --ink /
     --paper: "Show to waiter" must stay dark on light in both modes. */
  /* The order bar is the inverse of the page, so in light mode it is a dark
     block against white and needs no edge. In dark it becomes a pale block,
     and the cocktail shots above it are pale too — without a line they run
     into each other. Transparent here keeps the geometry identical. */
  --obar-rule:transparent;

  --foot-bg:var(--paper);
  --foot-ink:var(--ink);
  --foot-dim:var(--dim);
  --foot-rule:var(--rule);

  /* The lettered tile behind a card with no photo. Two of them, because it
     has to sit against the photography either side of it: cocktail shots are
     on white, food shots on black slate. Nothing to do with the theme. */
  --tile-food:#28282a;
  --tile-food-ink:#808080;

  --tile:#f6f4f1;      /* empty photo slot, before an image loads */
  --tile-fill:#f6f4f1; /* fill behind the name on a photoless card */
  --tile-ink:#b4ada0;  /* that card's lettering */
  --on-magenta:#fff;   /* text sitting on a magenta background */

  /* Jost carries no Hangul, so Korean would otherwise drop to whatever the
     device happens to have. Noto Sans KR picks up only the characters Jost
     cannot draw — Latin text is unaffected in any language. */
  font-family:'Jost','Noto Sans KR',system-ui,sans-serif;
}
/* ============================================================
   DARK MODE — one attribute on <html>, set by applyTheme().

   Asphalt rather than true black: on #000 the magenta goes muddy
   and the photographs float. Everything below is a value swap;
   no layout, no type, no geometry changes with the theme.

   Two things deliberately do NOT invert. The flame tints step
   DARKER to the left here, not lighter, so the right-hand flame
   stays the strongest one on a dark ground. And the foot of an
   order inverts to paper, so the button a customer holds up to
   a waiter is the brightest thing on the screen.
   ============================================================ */
html[data-theme="dark"]{
  --paper:#1b1b1e;
  --ink:#f2f0eb;
  --dim:#8a8a94;
  --rule:#3f3f45;

  --magenta:#dd5880;
  --magenta-dim:#9f556c;
  --heat-mid:#a33a58;
  --heat-soft:#6e2a3e;
  --on-magenta:#fff;

  --tile:#2b2b2b;
  --tile-fill:#f6f5f1;   /* drinks are shot on white, so this stays light */
  --tile-ink:#b6b4ac;

  --obar-rule:#3f3f45;

  --foot-bg:#f2f0eb;
  --foot-ink:#131313;
  --foot-dim:#807f8b;
  --foot-rule:#3f3f45;
}

/* the whole switch — one attribute, set by paintChrome() */
html[lang="ko"]{--tscale:var(--ko-type);--sscale:var(--ko-small);
  --tr:var(--ko-track);--lead:var(--ko-lead);--fscale:var(--ko-foot)}

body{background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:40px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;width:100%;height:100%;object-fit:cover}

/* ---------- masthead ---------- */
/* Masthead and tabs stick as ONE element. They used to stick separately,
   with the nav pinned at top:57px — a hardcoded guess at the masthead's
   height. Any change to it (the language icon, --ko-type raising the
   wordmark) made that number wrong and the tabs slid under. Nothing here
   measures anything now. */
.topbar{position:sticky;top:0;z-index:30;background:var(--paper)}
.mast{position:relative;background:var(--paper);
  display:flex;align-items:center;justify-content:space-between;padding:18px var(--gut) 13px}
.wordmark{font-weight:700;font-size:26px;letter-spacing:.01em;text-transform:uppercase;line-height:1}
/* The burger opens a short list of languages. The masthead is sticky, which
   makes it a containing block, so the panel hangs off its bottom edge. */
.drawer{position:absolute;right:var(--gut);top:100%;z-index:31;
  min-width:calc(var(--x)*46);background:var(--paper);border:1px solid var(--rule);
  padding:calc(var(--x)*1.5) 0;display:none}
.drawer.open{display:block}
.drawer button{display:flex;align-items:center;gap:calc(var(--x)*3);
  width:100%;text-align:left;color:var(--ink);
  padding:calc(var(--x)*3) calc(var(--x)*5);
  font-size:var(--t-item);letter-spacing:calc(.09em + var(--tr));text-transform:uppercase}
.drawer button.on{font-weight:600}
/* a language that exists but has no words yet */
.drawer button.soon{color:var(--rule);cursor:default}
.drawer .flag{font-size:calc(var(--x)*7);line-height:1}
/* the two masthead controls sit as one group on the right */
.mast-r{display:flex;align-items:center;gap:calc(var(--x)*4)}
.mode{display:flex;align-items:center;padding:6px 2px;color:var(--ink)}
.mode svg{display:block;height:calc(var(--x) * var(--mode-icon-h));width:auto;
  position:relative;top:calc(var(--x) * var(--mode-icon-y))}

/* ---------------------------------------------------------------
   THE LANGUAGE ICON. Same rule as the flame: to change it, replace the
   d="..." strings and the viewBox, nothing else. Colour comes from
   currentColor so it follows --ink. */
.burger{display:flex;align-items:center;padding:6px 2px;color:var(--ink)}
.burger svg{display:block;width:calc(var(--x) * var(--lang-icon));height:auto;
  position:relative;top:calc(var(--x) * var(--lang-icon-y))}

/* ---------- nav ---------- */
.nav{background:var(--paper);display:flex;align-items:center;
  overflow-x:auto;padding:0 var(--gut) 12px;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:0 0 auto;font-size:var(--t-nav);letter-spacing:calc(.05em + var(--tr));text-transform:uppercase;
  white-space:nowrap;padding:2px 0;color:var(--ink);font-weight:400}
.nav .bar{flex:0 0 auto;width:1px;height:calc(var(--t-nav)*.95);background:var(--rule);margin:0 10px}
.nav button.on{font-weight:600;box-shadow:0 2px 0 var(--ink)}

/* ---------- section ---------- */
.sec{padding:30px 0 2px}
.sec-head{display:flex;align-items:center;gap:15px;padding:0 var(--gut);margin-bottom:16px}
.sec-head h2{font-weight:600;font-size:var(--t-head);letter-spacing:calc(.03em + var(--tr));text-transform:uppercase;white-space:nowrap}
.sec-head .rule{flex:1;height:1px;background:var(--ink);opacity:.8}

/* ---------- carousel ---------- */
.rail{position:relative;display:flex;align-items:flex-start;gap:var(--gap);overflow-x:auto;padding:0 var(--gut) 2px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.rail::before{content:'';flex:0 0 var(--lead)}
.rail::after{content:'';flex:0 0 var(--trail)}

.item{flex:0 0 auto;width:var(--w-card);transition:width .3s cubic-bezier(.3,.85,.35,1)}
.item.open{width:var(--w-open)}
/* same card width on both tabs — only the photo's aspect and the
   panel's share of the open card differ */
.rail.food  .item{--w-open:var(--w-open-food); --ar:1;   --shot-h:var(--w-card)}
.rail.drink .item{--w-open:var(--w-open-drink);--ar:4/5; --shot-h:calc(var(--w-card)*1.25)}

.frame{display:flex;align-items:flex-start}
/* photo width is frozen — it never re-scales, so nothing repaints on open */
.shot{position:relative;flex:0 0 var(--w-card);width:var(--w-card);aspect-ratio:var(--ar);overflow:hidden;
  border:1px solid var(--rule);background:var(--tile)}
/* Food is photographed on black slate, so a white tile between two of those
   reads as a hole. Drinks are shot on white and keep the light tile. */
.rail.food .shot,.setshot{background:var(--tile-food)}
.rail.food .ph,.setshot .ph{background:var(--tile-food)}
.rail.food .ph span,.setshot .ph span{color:var(--tile-food-ink)}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  padding:12px;text-align:center;background:var(--tile-fill)}
.ph span{font-weight:500;font-size:var(--t-item);line-height:1.25;letter-spacing:calc(.06em + var(--tr));
  text-transform:uppercase;color:var(--tile-ink)}

/* the panel that unfurls — same hairline, shares the photo's edge */
.panel{flex:0 0 0;width:0;height:0;min-width:0;overflow:hidden;opacity:0;
  border:0;padding:0;
  display:flex;flex-direction:column;justify-content:space-between;
  transition:opacity .18s .08s}
.item.open .panel{flex:1 1 auto;width:auto;height:var(--shot-h);opacity:1;
  border:1px solid var(--rule);border-left:0;padding:9px 11px 8px}
.desc{font-size:var(--t-ing);letter-spacing:calc(.08em + var(--tr));text-transform:uppercase;line-height:var(--lead)}
.ing{list-style:none}
.ing li{font-size:var(--t-ing);letter-spacing:calc(.09em + var(--tr));text-transform:uppercase;line-height:var(--lead)}
.step{display:flex;align-items:center;justify-content:space-between;padding-top:8px}
.step button{font-size:calc(var(--x)*10);line-height:1;font-weight:300;padding:0 4px}
.step .q{font-size:calc(var(--x)*9);font-weight:400;min-width:22px;text-align:center}
/* untouched item: just a magenta +. The − and the count hold their space
   so the + doesn't jump when the first one is added. */
.step [data-step="-1"],.step .q{transition:opacity .16s}
.step.empty [data-step="-1"],.step.empty .q{opacity:0;pointer-events:none}
.step.empty [data-step="1"]{color:var(--magenta)}

/* ---------- add-ons ----------
   A sub-line of the parent item: its own cart line, but it cannot exist
   without the parent and never outnumbers it. Magenta + means another one
   can be added; grey means it cannot — no parent yet, or already matched.
   Two states only, because the customer is reading this in a dark bar. */
.addrow{display:flex;align-items:center;justify-content:space-between;
  gap:calc(var(--x)*2);border-top:1px solid var(--rule);
  margin-top:calc(var(--x)*3);padding-top:calc(var(--x)*2.5)}
.addlbl{font-size:var(--t-ing);letter-spacing:calc(.09em + var(--tr));text-transform:uppercase;
  color:var(--dim);line-height:1.3}
.addpr{color:var(--magenta)}
.step.addon{padding-top:0;flex:0 0 auto}
.step.addon button{font-size:calc(var(--x)*8);color:var(--dim)}
.step.addon .q{font-size:calc(var(--x)*7);color:var(--dim);min-width:calc(var(--x)*7)}
.step.addon [data-step="1"]{color:var(--rule)}
.step.addon.can [data-step="1"]{color:var(--magenta)}

/* caption — right-aligned to the PHOTO's right edge, never the panel's */
.cap{width:var(--w-card);padding-top:9px;text-align:right}
/* Each price sits directly under its own name. Names wrap to different
   line counts, so prices across a row are deliberately ragged: the rail
   shows about two cards at a time, so they are never compared side by
   side, and padding every name up to the tallest one left a visible hole
   under the short ones. */
.cap .nm{font-size:var(--t-item);letter-spacing:calc(.08em + var(--tr));text-transform:uppercase;
  line-height:1.3}
.cap .pr{font-size:var(--t-item);color:var(--magenta);letter-spacing:calc(.03em + var(--tr));margin-top:1px}

/* ---------- plain list tabs (mixers / beer / shots / bottles / non-alc) ---------- */
.list{padding:0 var(--gut)}
.listnote{font-size:var(--t-ing);letter-spacing:calc(.1em + var(--tr));text-transform:uppercase;color:var(--dim);
  padding:0 var(--gut) 12px;margin-top:-6px}

/* ---------- sets: static, full width, no expansion ---------- */
.stack{padding:0 var(--gut)}
.setcard+.setcard{margin-top:calc(var(--x) * var(--set-gap))}
.setshot{position:relative;width:100%;overflow:hidden;border:1px solid var(--rule);background:var(--tile)}
.setmeta{padding-top:calc(var(--x)*4)}
/* Two columns, same idea as the two-price rows: the blurb belongs under the
   name it describes, and the price with the control that buys it. */
.setsplit{display:flex;align-items:flex-start;gap:calc(var(--x)*5)}
.setleft{flex:1 1 auto;min-width:0}
.setright{flex:0 0 auto;text-align:right}
.setnm{font-size:var(--t-item);letter-spacing:calc(.08em + var(--tr));text-transform:uppercase;
  line-height:1.3}
.setpr{font-size:var(--t-item);color:var(--magenta);letter-spacing:calc(.03em + var(--tr));white-space:nowrap}
.setdesc{font-size:var(--t-ing);letter-spacing:calc(.08em + var(--tr));text-transform:uppercase;
  line-height:var(--lead);margin-top:calc(var(--x)*2)}
/* Under the price, in its own column, so the length of the blurb beside it
   changes nothing. */
.setmeta .step{justify-content:flex-end;gap:calc(var(--x)*2);
  padding-top:calc(var(--x) * var(--set-step-gap))}

/* ---------- non-alcoholic marker ---------- */
.star{position:absolute;left:0;top:0;z-index:2;
  padding:calc(var(--x)*1) calc(var(--x)*2.4);
  color:var(--magenta);font-size:calc(var(--x)*7);line-height:1;font-weight:500}
/* ---------- heat marker ----------
   Bottom-LEFT, deliberately: the cart badge stays bottom-right so it reads
   beside the item name. Flames overlap and get lighter leftwards, so the
   right-hand one is always full magenta and always on top — later siblings
   paint over earlier ones, so DOM order is simply left to right. */
.heat{position:absolute;left:0;bottom:0;z-index:2;display:flex;align-items:flex-end;
  padding:calc(var(--x) * var(--heat-inset-y)) calc(var(--x) * var(--heat-inset-x))}
.heat svg{display:block;width:calc(var(--x) * var(--heat-size));height:auto;position:relative}
.heat svg+svg{margin-left:calc(var(--x) * var(--heat-overlap) * -1)}
.h1{color:var(--magenta)}
.h2{color:var(--heat-mid)}
.h3{color:var(--heat-soft)}

.tag{display:inline-block;margin-bottom:calc(var(--x)*3);
  padding:calc(var(--x)*1.2) calc(var(--x)*2.4);
  background:var(--magenta);color:var(--on-magenta);
  font-size:calc(var(--x)*3*var(--sscale));
  letter-spacing:calc(.12em + var(--tr));text-transform:uppercase;font-weight:500}

/* ---------- cart badge on the photo card ---------- */
.badge{position:absolute;right:0;bottom:0;display:none;
  min-width:calc(var(--x)*8);height:calc(var(--x)*8);padding:0 calc(var(--x)*1.6);
  background:var(--magenta);color:var(--on-magenta);font-size:calc(var(--x)*4.4);font-weight:500;
  letter-spacing:calc(.02em + var(--tr));align-items:center;justify-content:center}
.badge.on{display:flex}

/* ---------- list rows ---------- */
.row{border-bottom:1px solid var(--rule);padding:calc(var(--x)*4) 0}
.row:first-child{border-top:1px solid var(--rule)}
.rowname{font-size:var(--t-item);letter-spacing:calc(.07em + var(--tr));text-transform:uppercase;line-height:1.3}
.rowname .sub{margin-left:calc(var(--x)*2.4);font-size:var(--t-ing);
  letter-spacing:calc(.09em + var(--tr));color:var(--dim)}
/* The +/- buttons are set about twice the height of the item name beside
   them, and a centred flex row takes its height from the tallest child. So
   the name sat in the middle of a stepper-height row, with dead space under
   it that --note-gap could add to but never remove. Negative block margins
   let the buttons overhang the row instead of inflating it: the tap target
   is unchanged, the row is now the height of the name, and --note-gap goes
   all the way down to 0. Only on note-below rows — Beer and Bottles keep
   the roomier row they already had. */
.nbrow .vrow .step{margin-block:calc(var(--x) * var(--step-squeeze) * -1)}
/* Note-below rows are two lines tall, so the stepper centres against the
   pair instead of sitting on the name's line. The price stays up with the
   name — unless the section asks for "centreRow", which sends the price
   down to the middle with the stepper. */
.nbtext{flex:1;min-width:0}
.nbtop{display:flex;align-items:baseline;gap:calc(var(--x)*3)}
.nbtop .rowname{flex:1;min-width:0}
.nbrow .subline{margin-top:calc(var(--x) * var(--note-gap))}

/* set by "noteBelow": true on a section — the note drops under the name
   instead of trailing it, for sections whose notes are ingredient lists.
   Price and stepper stay on the name's line, not centred on the pair. */
.subline{font-size:var(--t-ing);letter-spacing:calc(.09em + var(--tr));text-transform:uppercase;
  color:var(--dim);line-height:var(--note-lead);
  margin-top:calc(var(--x) * var(--note-gap))}
.vrow{display:flex;align-items:center;gap:calc(var(--x)*4);padding:calc(var(--x)*1.5) 0}
.vrow.single{padding:0}
.vrow .rowname{flex:1;min-width:0}
.vname{font-size:var(--t-ing);letter-spacing:calc(.09em + var(--tr));text-transform:uppercase;color:var(--dim)}
/* ---------- two-price rows (Mixers, Bottles) ----------
   Left column names the thing, right column stacks its sizes. Side by side
   the two steppers sat next to the wrong prices, and the variety line
   ("Bourbon") was styled identically to the size line ("Shot") — same grey,
   same caps, different job. Splitting them by column tells them apart by
   position instead of by adding a third grey, and gives the variety line a
   home: on Mixers it can finally say which gin is in the gin and tonic.
   One stepper per line, all of them ending at the same right edge. */
.vsplit{display:flex;align-items:flex-start;gap:calc(var(--x)*5)}
.vleft{flex:1 1 0;min-width:0}
.vright{flex:1 1 0;min-width:0}
/* The size label and its price stack; the stepper sits beside the pair and
   centres against both, rather than riding the price's line. */
.vline{display:flex;align-items:center;gap:calc(var(--x)*2)}
.vline+.vline{border-top:1px solid var(--rule);
  margin-top:calc(var(--x)*2.5);padding-top:calc(var(--x)*2.5)}
.vtext{flex:1;min-width:0}
.vline .vname{display:block}
.vline .vpr{display:block;text-align:left;margin-top:calc(var(--x)*.5)}
/* same trick as the note-below rows: let the buttons overhang rather than
   inflate the line they sit on */
.vline .step{padding-top:0;gap:calc(var(--x)*1);flex:0 0 auto;
  margin-block:calc(var(--x) * var(--step-squeeze) * -1)}
.vpr{font-size:var(--t-item);color:var(--magenta);letter-spacing:calc(.03em + var(--tr));
  white-space:nowrap;text-align:right}
.vrow .step{padding-top:0;gap:calc(var(--x)*1);flex:0 0 auto;
  min-width:calc(var(--x)*22);justify-content:flex-end}
.chip{display:none}

/* ---------- order bar ---------- */
body.hasbar{padding-bottom:calc(var(--x)*30)}
.obar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink);color:var(--paper);
  border-top:1px solid var(--obar-rule);
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--x)*4) var(--gut) calc(var(--x)*4 + env(safe-area-inset-bottom));
  transform:translateY(110%);transition:transform .24s cubic-bezier(.3,.85,.35,1)}
.obar.show{transform:none}
.ob-l{font-size:var(--t-item);letter-spacing:calc(.07em + var(--tr));text-transform:uppercase}
.ob-l .dot{margin:0 7px;opacity:.5}
.ob-go{border:1px solid var(--paper);padding:calc(var(--x)*3) calc(var(--x)*7);
  font-size:var(--t-item);letter-spacing:calc(.12em + var(--tr));text-transform:uppercase}

/* ---------- order page ---------- */
.sheet,.waiter{position:fixed;inset:0;z-index:50;background:var(--paper);
  display:flex;flex-direction:column;transform:translateY(100%);
  transition:transform .26s cubic-bezier(.3,.85,.35,1)}
.sheet.show,.waiter.show{transform:none}
.waiter{z-index:60}
.sheet-top,.wtop{display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--x)*7) var(--gut) calc(var(--x)*5);border-bottom:1px solid var(--rule)}
.sheet-top h2,.wtop h2{font-size:var(--t-head);font-weight:600;letter-spacing:calc(.06em + var(--tr));text-transform:uppercase}
.x{font-size:calc(var(--x)*11);line-height:1;padding:0 4px;color:var(--dim)}
.sheet-body{flex:1;overflow-y:auto;padding:0 var(--gut)}
/* An item and its add-ons are one block with one divider around them.
   Add-on rows are always present while the parent is in the order, even at
   zero, so a customer can add or take back fries without going hunting for
   the card again — and cannot accidentally delete the row out of existence. */
.ogroup{border-bottom:1px solid var(--rule)}
.oline{display:flex;align-items:center;gap:calc(var(--x)*4);padding:calc(var(--x)*5) 0}
.oline.ohas{padding-bottom:calc(var(--x)*1.5)}
/* An add-on is a line the customer will be charged for, so on the order it
   is set like one: same type size, same stepper, same price column. Grey
   text and a softer magenta keep it subordinate to its dish, and the indent
   does the work the smaller size used to. */
.oline.oadd{padding:calc(var(--x)*2.5) 0 calc(var(--x)*4)}
.oadd .ol{padding-left:calc(var(--x) * var(--addon-indent))}
.oaddnm{font-size:var(--t-item);letter-spacing:calc(.07em + var(--tr));
  text-transform:uppercase;color:var(--dim);line-height:1.3}
.oadd .ostep button{color:var(--dim)}
.oadd .ostep .q{color:var(--dim)}
.oadd .ostep .q.off,.oadd .ostep [data-o="-1"].off{opacity:0;pointer-events:none}
.oadd .ostep [data-o="1"]{color:var(--rule)}
.oadd .ostep [data-o="1"].can{color:var(--magenta)}
.oadd .opr{color:var(--magenta-dim)}
.oadd .opr.zero{color:var(--dim)}
/* keeps the add-on's price in the same column as the item's, where the
   parent row has a × button and the add-on row does not */
.oxs{flex:0 0 calc(var(--x)*9)}
.ol{flex:1;min-width:0}
.onm{font-size:var(--t-item);letter-spacing:calc(.07em + var(--tr));text-transform:uppercase;line-height:1.3}
.osub{font-size:var(--t-ing);letter-spacing:calc(.09em + var(--tr));text-transform:uppercase;color:var(--dim);margin-top:3px}
.ostep{display:flex;align-items:center;gap:calc(var(--x)*2)}
.ostep button{font-size:calc(var(--x)*8);line-height:1;font-weight:300;padding:0 calc(var(--x)*1.5)}
.ostep .q{font-size:var(--t-item);min-width:calc(var(--x)*7);text-align:center}
.opr{font-size:var(--t-item);color:var(--magenta);min-width:calc(var(--x)*13);text-align:right}
.ox{flex:0 0 calc(var(--x)*9);font-size:calc(var(--x)*7);line-height:1;
  color:var(--dim);padding:0;text-align:right}
.sheet-foot{background:var(--foot-bg);border-top:1px solid var(--foot-ink);
  padding:calc(var(--x)*5) var(--gut)
  calc(var(--x)*6 + env(safe-area-inset-bottom))}
.sheet-foot.hide{display:none}
.totrow{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:calc(var(--x)*5)}
.totlbl{font-size:var(--t-item);letter-spacing:calc(.14em + var(--tr));
  text-transform:uppercase;color:var(--foot-ink)}
.totval{font-size:calc(var(--x)*10);font-weight:600;color:var(--foot-ink)}
/* Clear is a rare bulk action — every line already has its own × — and it
   sat the same size as the primary button, right next to it. Same height and
   the same row, a quarter of the width: still there, no longer a mis-tap
   waiting to happen at 1am. */
.acts{display:flex;gap:calc(var(--x)*3)}
.btn{padding:calc(var(--x)*5);font-size:var(--t-item);letter-spacing:calc(.12em + var(--tr));text-transform:uppercase}
.ghost{flex:var(--clear-share);border:1px solid var(--foot-rule);color:var(--foot-dim)}
.solid{flex:var(--waiter-share);background:var(--foot-ink);color:var(--foot-bg)}

/* ---------- undo ----------
   Clearing happens immediately and is then recoverable, rather than being
   guarded by a confirm. One tap either way, and it rescues the accident
   instead of taxing everyone who meant it. */
.undo{display:none;align-items:center;gap:calc(var(--x)*3);
  background:var(--ink);color:var(--paper);
  padding:calc(var(--x)*4) var(--gut)}
.undo.show{display:flex}
.undo-l{flex:1;min-width:0;font-size:var(--t-ing);
  letter-spacing:calc(.08em + var(--tr));text-transform:uppercase}
.undo-go{font-size:var(--t-ing);letter-spacing:calc(.12em + var(--tr));
  text-transform:uppercase;font-weight:600;color:var(--paper);
  border-bottom:1px solid var(--paper);padding-bottom:1px}
.undo-x{font-size:calc(var(--x)*7);line-height:1;color:var(--paper);opacity:.6;padding:0 calc(var(--x)*1)}
.mt{padding:calc(var(--x)*24) 0;text-align:center;color:var(--dim);
  font-size:var(--t-item);letter-spacing:calc(.08em + var(--tr));text-transform:uppercase}

/* ---------- waiter view — no prices, big enough to read across a bar ---------- */
/* Locked to WAITER_LANG, so it must not inherit the customer's type scale —
   an English staff screen sized for Hangul would be oversized. */
.waiter{--tscale:1;--sscale:1;--tr:var(--en-track);--lead:var(--en-lead);
  --fscale:var(--en-foot)}
.wbody{flex:1;overflow-y:auto;padding:calc(var(--x)*3) var(--gut) calc(var(--x)*10)}
.wbody h3{font-size:var(--t-item);letter-spacing:calc(.18em + var(--tr));text-transform:uppercase;color:var(--dim);
  padding:calc(var(--x)*8) 0 calc(var(--x)*2);border-bottom:1px solid var(--rule)}
.wline{display:flex;align-items:baseline;gap:calc(var(--x)*4);padding:calc(var(--x)*4) 0}
.wq{flex:0 0 calc(var(--x)*13);text-align:right;white-space:nowrap;
  font-size:calc(var(--x)*7);font-weight:600}
/* flex, not inline text: the add-on note sits on the vertical centre of the
   dish name rather than dropping to its baseline, which reads as a footnote */
.wn{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;
  gap:calc(var(--x)*2.5);font-size:calc(var(--x)*7);letter-spacing:calc(.04em + var(--tr));
  text-transform:uppercase;line-height:1.25}
.wn em{font-style:normal;color:var(--dim);font-size:calc(var(--x)*5);line-height:1.25}

/* staff notice when running from cache */
.stale{position:fixed;left:0;right:0;top:0;z-index:99;background:var(--magenta);color:var(--on-magenta);
  padding:calc(var(--x)*3) var(--gut);font-size:var(--t-ing);letter-spacing:calc(.06em + var(--tr));
  text-transform:uppercase;line-height:1.5;text-align:center}

/* ---------- event poster ---------- */
.poster-sec{padding:calc(var(--x)*11) 0 0}
.poster{position:relative;margin:0 var(--gut);aspect-ratio:4/5;
  overflow:hidden;border:1px solid var(--rule);background:var(--tile)}
.poster .ph span{font-size:calc(var(--x)*9)}

.stub{padding:60px var(--gut);text-align:center;color:var(--dim);
  font-size:var(--t-item);letter-spacing:calc(.08em + var(--tr));text-transform:uppercase}
.foot{padding:36px var(--gut) 8px;margin-top:30px;border-top:1px solid var(--rule);
  font-size:calc(var(--x)*4*var(--fscale));line-height:1.8;color:var(--dim);
  letter-spacing:calc(.02em + var(--tr))}

@media(min-width:560px){
  body{max-width:430px;margin:0 auto;border-left:1px solid var(--rule);border-right:1px solid var(--rule);min-height:100vh}
}
</style>
</head>

<script>
const IMG = JSON.parse(document.getElementById('imgdata').textContent);
const pic = id => IMG[id] || null;

/* ============================================================
   LANGUAGES

   Every visible string in the JSON files may be either a plain
   string or an object keyed by language:

       "name": "Birria Tacos"
       "name": { "en": "Birria Tacos", "ko": "비리아 타코" }

   A plain string is treated as English, so a half-translated
   file works: untranslated entries simply stay in English
   rather than going blank.

   ENGLISH IS LOAD-BEARING and cannot be dropped. It generates
   the cart ids and the photo filenames, which is what lets a
   customer switch language mid-order without losing their
   basket — the ids never move because they are built from a
   string that never changes.

   Adding Spanish is this list plus a label, and nothing else.
   ============================================================ */
const LANGS = ['en', 'ko'];
/* Listed in the drawer but not selectable — the words do not exist yet.
   Moving 'es' from here into LANGS above is the whole of switching it on. */
const LANG_SOON  = ['es'];
const LANG_LABEL = {en:'EN',   ko:'KOR',  es:'ESP'};
const LANG_FLAG  = {en:'🇬🇧', ko:'🇰🇷', es:'🇪🇸'};

/* The staff screen. Locked to one language regardless of what the customer
   is browsing in, so the bar reads the same order every time. Change this
   one string to hand the waiter view to Korean instead. */
const WAITER_LANG = 'en';

const LANG_KEY = 'hideout.lang';

/* ============================================================
   THEME

   The device decides, because a customer who has set their
   phone to dark at 11pm has already told us what they want.
   Only when the device will not say — an old browser, a
   webview that answers neither query — do we fall back to the
   clock, and to Seoul's clock rather than the phone's, since
   the thing that is actually dark is this bar.

   A manual choice outranks both and is remembered.
   ============================================================ */
const THEME_KEY = 'hideout.theme';
const THEMES = ['light', 'dark'];

/* Material Symbols, one path each. Replace the d="..." to change them. */

/* The icon shows what you will GET, not what you are in — a moon while the
   menu is light. Swap the two lines in themeIcon() for the other convention. */
const DARK_FROM = 18 * 60;      // 18:00 Seoul
const DARK_UNTIL = 8 * 60;      // until 08:00

function darkByClock(){
  const min = seoulNow().min;
  return min >= DARK_FROM || min < DARK_UNTIL;
}

function firstTheme(){
  try{
    const saved = localStorage.getItem(THEME_KEY);
    if(saved && THEMES.includes(saved)) return saved;
  }catch(e){}
  try{
    if(window.matchMedia){
      if(matchMedia('(prefers-color-scheme: dark)').matches)  return 'dark';
      if(matchMedia('(prefers-color-scheme: light)').matches) return 'light';
    }
  }catch(e){}
  return darkByClock() ? 'dark' : 'light';   // the device would not say
}

let THEME = 'light';            // real value set in start(), once seoulNow exists

function firstLang(){
  try{
    const saved = localStorage.getItem(LANG_KEY);
    if(saved && LANGS.includes(saved)) return saved;
  }catch(e){}
  /* No choice made yet — follow the phone, since a customer who has set
     their device to Korean almost certainly wants the Korean menu. */
  try{
    const want = [navigator.language, ...(navigator.languages || [])];
    for(const w of want){
      const base = String(w || '').toLowerCase().split('-')[0];
      if(LANGS.includes(base)) return base;
    }
  }catch(e){}
  return 'en';
}

let LANG = firstLang();

/* loc() — what to show the customer. can() — the English underneath, for
   ids, filenames and the waiter. Both take a string or a language object. */
function pick(v, lang){
  if(v == null) return '';
  if(typeof v !== 'object') return String(v);
  if(Array.isArray(v)) return '';
  return v[lang] !== undefined ? String(v[lang])
       : v.en !== undefined ? String(v.en)
       : String(Object.values(v)[0] ?? '');
}
const loc = v => pick(v, LANG);
const can = v => pick(v, 'en');

/* A description may be one string or a list of lines. A list puts each entry
   on its own line; a plain string can do the same with \n inside it. Both
   work per language, so English can be split and Korean not, or the reverse.
   Escaped line by line — the <br> is ours, nothing from the file is markup. */
function locLines(v){
  let raw = v;
  if(v && typeof v === 'object' && !Array.isArray(v)){
    raw = v[LANG] !== undefined ? v[LANG] : (v.en !== undefined ? v.en : Object.values(v)[0]);
  }
  const lines = Array.isArray(raw) ? raw.map(loc) : String(raw == null ? '' : raw).split('\n');
  return lines.map(x => x.trim()).filter(Boolean).map(esc).join('<br>');
}

/* Ingredient lists translate as a whole list, not entry by entry:
   "ingredients": { "en": ["Gin","Lime"], "ko": ["진","라임"] } */
function locArr(v){
  if(!v) return [];
  if(Array.isArray(v)) return v.map(loc);
  const a = v[LANG] !== undefined ? v[LANG] : (v.en !== undefined ? v.en : Object.values(v)[0]);
  return Array.isArray(a) ? a.map(loc) : [];
}
